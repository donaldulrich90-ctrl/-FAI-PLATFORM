<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#043D2B">
<title>Hors ligne — Faso ISP</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #0a1628; color: #e2e8f0; display: flex; align-items: center;
         justify-content: center; min-height: 100vh; text-align: center; padding: 24px; }
  .wrap { max-width: 320px; }
  .icon { font-size: 64px; margin-bottom: 24px; }
  h1 { font-size: 22px; font-weight: 700; color: #f1f5f9; margin: 0 0 12px; }
  p  { font-size: 14px; color: #94a3b8; line-height: 1.6; margin: 0 0 28px; }
  button { background: #043D2B; color: #C9972C; border: 1.5px solid #C9972C;
           border-radius: 10px; padding: 12px 28px; font-size: 14px; font-weight: 600;
           cursor: pointer; }
  button:hover { background: #065c41; }
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">📡</div>
  <h1>Connexion perdue</h1>
  <p>Vous êtes hors ligne. Reconnectez-vous à Internet pour accéder à Faso ISP Manager.</p>
  <button onclick="location.reload()">Réessayer</button>
</div>
</body>
</html>
